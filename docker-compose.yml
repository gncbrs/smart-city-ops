services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcityops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartcityops
      POSTGRES_PASSWORD: smartcityops
      POSTGRES_DB: smartcityops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcityops -d smartcityops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
